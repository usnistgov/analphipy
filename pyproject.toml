[build-system]
build-backend = "uv_build"
requires = [
    "uv-build>=0.12.7,<0.13.0",
]

[project]
name = "analphipy"
version = "0.4.1"
description = "Utilities to perform stat mech analysis of pair potentials"
readme = "README.md"
keywords = [
    "analphipy",
]
license = "NIST-PD"
license-files = [ "LICENSE" ]
authors = [
    { name = "William P. Krekelberg", email = "wpk@nist.gov" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "attrs",
    "module-utilities[inherit]>=0.10.1",
    "numpy",
    "scipy",
    "typing-extensions; python_version<'3.12'",
]

[project.optional-dependencies]
viz = [
    "matplotlib",
    "pandas",
]

[project.urls]
Documentation = "https://pages.nist.gov/analphipy/"
Homepage = "https://github.com/usnistgov/analphipy"

[dependency-groups]
dev = [
    { include-group = "mypy" },
    { include-group = "notebook" },
    { include-group = "nox" },
    { include-group = "optional" },
    { include-group = "pytest-accept" },
    { include-group = "test" },
    { include-group = "test-notebook" },
    { include-group = "type" },
]
test = [
    "pytest-cov",
    "pytest-sugar",
    "pytest-xdist",
    { include-group = "pandas" },
    { include-group = "pytest" },
]
type = [
    "pandas-stubs",
    "scipy-stubs",
    { include-group = "nox" },
    { include-group = "pandas" },
    { include-group = "pylint" },
    { include-group = "pytest" },
    { include-group = "typecheck-runner" },
]
docs = [
    "autodocsumm",
    "myst-nb",
    "sphinx>=5.3.0",
    # other
    "sphinx-book-theme",
    "sphinx-copybutton",
    { include-group = "optional" },
]
# other groups
basedpyright = [ "basedpyright>=1.39.10" ]
docs-live = [
    "sphinx-autobuild",
    { include-group = "docs" },
]
docs-spelling = [
    "pyenchant",
    "sphinxcontrib-spelling",
    { include-group = "docs" },
]
ipython = [ "ipython" ]
mypy = [ "mypy[faster-cache]>=2.3.1" ]
notebook = [ "ipykernel", "nbclient" ]
nox = [ "nox>=2026.8.17" ]
optional = [ "analphipy[viz]" ]
pandas = [ "pandas" ]
pylint = [ "pylint" ]
pytest = [ "pytest" ]
pytest-accept = [ "pytest-accept" ]
test-extras = [
    { include-group = "test" },
]
test-notebook = [
    "nbval",
    { include-group = "optional" },
    { include-group = "test" },
]
typecheck-runner = [ "typecheck-runner>=0.2.0; python_version>'3.9'" ]

# * uv -------------------------------------------------------------------------
[tool.uv]
required-version = ">=0.11.8"
default-groups = [ "dev" ]
fork-strategy = "requires-python"
exclude-newer = "7 days"
# Needed until prek>=0.5.0 is 7 days old
exclude-newer-package = { prek = "0 days" }
managed = true
build-backend.source-exclude = [ ".*cache" ]
build-backend.source-include = [ "tests/**" ]
pip.annotation-style = "line"
pip.generate-hashes = true

[tool.uv.dependency-groups]
dev.requires-python = ">=3.14"
docs.requires-python = ">=3.14"
docs-live.requires-python = ">=3.14"
docs-spelling.requires-python = ">=3.14"
# other tools
ipython.requires-python = ">=3.14"
mypy.requires-python = ">=3.14"
notebook.requires-python = ">=3.14"
nox.requires-python = ">=3.14"

# ruff -------------------------------------------------------------------------
[tool.ruff]
extend-include = [
    "*.ipynb",
]
extend-exclude = [
    ".numba_cache",
    ".venv",
    "dist-conda",
]
fix = true
# unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true
preview = true  # needed for markdown support

[tool.ruff.lint]
preview = true
select = [
    "ALL",
]
# fixable = [ "ALL" ]
unfixable = [
    "non-augmented-assignment",
    "ERA",
    "T",
]
ignore = [
    "any-type",                             # - Any ok sometimes
    "COM",                                  # - flake8-commas, formatter should take care of this?
    "CPY",                                  # - Don't require copyright
    "undocumented-magic-method",            # - Missing magic method docstring
    "undocumented-public-init",             # - Missing docstring in __init__
    "incorrect-blank-line-before-class",    # - 1 blank line required before class docstring
    "missing-blank-line-after-summary",     # - blank line after summary
    "multi-line-summary-first-line",        # - Multi-line docstring summary should start at the first line
    "missing-trailing-period",              # - First line should end with a period
    "non-imperative-mood",                  # - First line of docstring should be in imperative mood: "{first_line}"
    "docstring-missing-returns",            # - Missing return from documentation
    "docstring-missing-exception",          # - Missing raises from documentation
    "line-too-long",                        # - line too long - let formatter fix this
    "lambda-assignment",                    # - do not assign a lambda expression, use a def
    "FBT",                                  # - bools are ok
    "import-outside-top-level",             # - import should be at top level (leads to issues with imports in func?)
    "suspicious-subprocess-import",         # - Want to use subprocess sometimes
    "subprocess-without-shell-equals-true", # - subprocess-without-shell-equals-true
    "start-process-with-partial-path",      # - start-process-with-partial-path
    "relative-imports",                     # - Allow relative imports
]
isort.known-first-party = [
    "analphipy",
]
pydocstyle.convention = "numpy"
pylint.max-args = 15
pylint.max-positional-args = 15
pylint.max-public-methods = 30
ruff.strictly-empty-init-modules = false

[tool.ruff.lint.per-file-ignores]
"src/**" = [
    "NPY", # - not using numpy?
    "PD",  # - not using pandas?
]
"tests/**" = [
    "D",      # - Don't need to document tests
    "assert", # - Assert is fine with tests
    "ANN",
]
"examples/**" = [
    "useless-expression",               # - Don't remove useless expressions in notebooks
    "ANN",
    "D",
    "module-import-not-at-top-of-file",
    "implicit-namespace-package",
]

# * Checks ---------------------------------------------------------------------
[tool.repo-review]
ignore = [
    "NOX103", # I prefer using "nox.options.sessions"
    "PC111",  # use doccmd instead of blacken-docs
    "PC140",  # do this externally
    "PC160",  # use typos
    "PC170",  # pygrep
]

[tool.check-wheel-contents]
src_dir = [ "src" ]
toplevel = [ "analphipy" ]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
# max_supported_python = "3.13"
expand_tables = [
    "project.entry-points",
    "project.optional-dependencies",
    "project.scripts",
    "project.urls",
    "tool.mypy.overrides",
    "tool.pyproject2conda",
    "tool.pyrefly.sub-config",
    "tool.pyright.executionEnvironments",
    "tool.pytest",
    "tool.ruff.format",
    "tool.ruff.lint",
    "tool.ruff.lint.per-file-ignores",
    "tool.ty.overrides",
    "tool.typos",
    "tool.uv.dependency-groups",
    "tool.uv.exclude-newer-package",
]

[tool.typos.default]
# nbqa generated
extend-ignore-re = [ "# %%NBQA-.*" ]

[tool.typos.default.extend-identifiers]
CPY = "CPY"

[tool.typos.type.jupyter]
# only check file name for notebooks.  Use nbaq for contents.
check-file = false

# * typecheck ---------------------------------------------------------------------
[tool.mypy]
files = [
    "noxfile.py",
    "src",
    "tests",
    "tools",
]
# options
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [ "tests.*" ]
disable_error_code = "arg-type"

[[tool.mypy.overrides]]
module = [ "matplotlib.*" ]
ignore_missing_imports = true

[tool.pyrefly]
enabled-ignores = [ "pyrefly" ]
project-includes = [
    "examples/usage/*.ipynb",
    "noxfile.py",
    "src",
    "tests",
    "tools",
]
search-path = [ "." ]

[[tool.pyrefly.sub-config]]
ignore-missing-imports = [ "matplotlib.*" ]
matches = "examples/**"

[tool.pyright]
typeCheckingMode = "standard"
strict = [
    "noxfile.py",
    "src",
    "tools/*.py",
]
include = [
    "examples/usage/*.ipynb",
    "noxfile.py",
    "src",
    "tests",
    "tools",
]
exclude = [
    "**/.mypy_cache",
    "**/.numba_cache",
    "**/__pycache__",
    ".nox/**",
    ".tox/**",
    ".venv/**",
]
enableTypeIgnoreComments = false
deprecateTypingAliases = true
reportCallInDefaultInitializer = true
reportImplicitOverride = true
reportImplicitStringConcatenation = false
reportImportCycles = false
# reportMissingSuperCall = true
reportOverlappingOverload = true
reportPrivateImportUsage = false
reportPrivateUsage = false
reportPropertyTypeMismatch = true
reportUninitializedInstanceVariable = true
reportUnnecessaryTypeIgnoreComment = true
reportUnreachable = "warning"
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true
reportUnusedCallResult = true
reportUnusedImport = false
reportUnusedVariable = false
enableReachabilityAnalysis = false

[[tool.pyright.executionEnvironments]]
root = "tests"
# TODO(wpk): get rid of these
reportArgumentType = false
reportImplicitOverride = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnusedCallResult = false

[[tool.pyright.executionEnvironments]]
reportUnusedCallResult = false
reportMissingImports = false
root = "examples"

[tool.ty]
src.include = [
    "examples/usage/*.ipynb",
    "noxfile.py",
    "src",
    "tests",
    "tools",
]
analysis.respect-type-ignore-comments = false

[[tool.ty.overrides]]
include = [ "examples/**" ]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = [ "matplotlib.*" ]

# * Testing --------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = [
    "--cov-config=pyproject.toml",
    "--doctest-glob=*.md",
    "--doctest-modules",
    "--pyargs",
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = [
    "README.md",
    "analphipy",
    "tests",
]
# options
filterwarnings = [ "error" ]
log_cli_level = "INFO"
log_level = "INFO"
minversion = "8"
strict_xfail = "true"

[tool.coverage]
run.source = [
    "analphipy",
]
run.branch = true
paths.source = [
    "src/",
    # needed for testing source if not editable install
    ".nox/**/site-packages/",
    "*/.nox/**/site-packages",
    "*/src",
]
report.include = [
    "src/*",
]
report.omit = [
    "*/_typing.py",
    "*/vendored/*",
]
report.exclude_also = [
    "@overload",
    "if TYPE_CHECKING:",
]
report.show_missing = true

[tool.commitizen]
use_shortcuts = true

# * Dependency creation --------------------------------------------------------
[tool.pyproject2conda]
template-python = "requirements/py{py}-{env}"
template = "requirements/{env}"
name = "py{py}-{env}"
python = "default"
channels = "conda-forge"
style = "yaml"
conda-deps = "pip"

[tool.pyproject2conda.dependencies]
pytest-accept = { pip = true }

[tool.pyproject2conda.envs.dev]
groups = "dev"

[tool.pyproject2conda.envs.test]
groups = "test"
python = "all"

[tool.pyproject2conda.envs.test-extras]
groups = "test-extras"
python = "all"
skip-package = true

[tool.pyproject2conda.envs.uvx-tools]
pip-deps = [
    # these used solely for specking tools to be run via uvx ...
    "conda-lock>=4.0.2",
    "copier-template-extensions>=0.3.3",
    "copier>=9.17.2",
    "grayskull>=3.1.1",
    "nbqa>=1.9.1",
    "prek>=0.5.2",
    "pyrefly>=1.2.0",
    "pyright>=1.1.411",
    "rooster>=0.1.1",
    "twine>=7.0.0",
    "ty>=0.0.75",
]
groups = [
    "basedpyright",
    "mypy",
    "nox",
    "typecheck-runner",
]
skip-package = true
style = "requirements"

[tool.uv-locker]
scripts = [
    "noxfile.py",
    "tools/check_dist_version.py",
    "tools/clean_kernelspec.py",
]

[[tool.uv-locker.requirements]]
path = "requirements/uvx-tools.txt"
output-file = "requirements/lock/uvx-tools.txt"
python = "min"
options = [
    "--no-deps",
    "--no-strip-extras",
    "--universal",
]

# * Other tools ----------------------------------------------------------------
[tool.rooster]
changelog_contributors = true
major-labels = [ "breaking" ]
minor_labels = [ "enhancement" ]
patch-labels = [ "bug", "documentation" ]
# options
ignore-labels = [ "internal" ]
require-labels = [ "breaking", "bug", "documentation", "enhancement" ]
version_files = [
    "pyproject.toml",
]
# sections
section-labels."Breaking changes" = [ "breaking" ]
section-labels."Bug fixes" = [ "bug" ]
section-labels.Documentation = [ "documentation" ]
section-labels.Enhancements = [ "enhancement" ]
section-labels.Internal = [ "internal" ]
section-labels."Other changes" = [ "__unknown__" ]
